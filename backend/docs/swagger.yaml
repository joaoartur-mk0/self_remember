basePath: /api/v1
definitions:
  http.areaResponse:
    properties:
      color:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  http.channelResponse:
    properties:
      address:
        type: string
      fallback_order:
        type: integer
      id:
        type: string
      kind:
        type: string
      verified:
        type: boolean
    type: object
  http.commitmentResponse:
    properties:
      archived_at:
        type: string
      area_id:
        type: string
      carry_over_policy:
        type: string
      description:
        type: string
      id:
        type: string
      label_ids:
        items:
          type: string
        type: array
      nag_profile:
        type: string
      recurrence_rule:
        type: string
      recurrence_start:
        type: string
      title:
        type: string
    type: object
  http.confirmVerificationRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  http.createAreaRequest:
    properties:
      color:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  http.createChannelRequest:
    properties:
      address:
        type: string
      kind:
        type: string
    required:
    - address
    - kind
    type: object
  http.createCommitmentRequest:
    properties:
      area_id:
        type: string
      carry_over_policy:
        type: string
      description:
        type: string
      label_ids:
        items:
          type: string
        type: array
      nag_profile:
        type: string
      recurrence_rule:
        type: string
      recurrence_start:
        type: string
      title:
        type: string
    required:
    - area_id
    - carry_over_policy
    - description
    - nag_profile
    - recurrence_start
    - title
    type: object
  http.createLabelRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  http.dashboardDay:
    properties:
      date:
        description: |-
          Date é AAAA-MM-DD no fuso de Ajustes — o cliente não deve derivar o
          dia a partir de due_at com o fuso do navegador, que pode ser outro.
        type: string
      items:
        items:
          $ref: '#/definitions/http.dashboardItem'
        type: array
    type: object
  http.dashboardItem:
    properties:
      area_color:
        type: string
      area_id:
        type: string
      area_name:
        type: string
      current_step:
        type: integer
      description:
        type: string
      due_at:
        type: string
      id:
        type: string
      nag_profile:
        type: string
      state:
        type: string
      title:
        type: string
    type: object
  http.dashboardResponse:
    properties:
      days:
        description: |-
          Days tem sempre dashboardDays entradas, começando em hoje, mesmo as
          vazias — a agenda mantém a mesma forma a cada acesso.
        items:
          $ref: '#/definitions/http.dashboardDay'
        type: array
      overdue:
        description: Overdue são as Ocorrências em aberto de dias anteriores a hoje.
        items:
          $ref: '#/definitions/http.dashboardItem'
        type: array
      timezone:
        type: string
    type: object
  http.instanceQRCodeResponse:
    properties:
      qrcode:
        description: |-
          QRCode é uma data URI ("data:image/png;base64,...") pronta para um
          <img src>, ou vazia se a EvolutionAPI não tiver um QR novo para
          devolver agora (ex.: já conectada, ou pareamento anterior ainda
          válido) — o cliente decide o que mostrar consultando Status junto.
        type: string
    type: object
  http.instanceStatusResponse:
    properties:
      state:
        type: string
    type: object
  http.labelResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  http.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  http.occurrenceResponse:
    properties:
      current_step:
        type: integer
      due_at:
        type: string
      id:
        type: string
      state:
        type: string
      title:
        type: string
    type: object
  http.settingsResponse:
    properties:
      default_carry_over_policy:
        type: string
      default_nag_profile:
        type: string
      quiet_hours_end:
        type: string
      quiet_hours_start:
        type: string
      timezone:
        type: string
    type: object
  http.snoozeRequest:
    properties:
      due_at:
        type: string
    required:
    - due_at
    type: object
  http.updateAreaRequest:
    properties:
      color:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  http.updateSettingsRequest:
    properties:
      default_carry_over_policy:
        type: string
      default_nag_profile:
        type: string
      quiet_hours_end:
        type: string
      quiet_hours_start:
        type: string
      timezone:
        type: string
    required:
    - default_carry_over_policy
    - default_nag_profile
    - timezone
    type: object
info:
  contact: {}
  description: 'API do Self Remember. Local/dev apenas: /swagger não é exposto em
    produção sem Traefik/auth na frente (ARCHITECTURE.md §9, fase de Produção ainda
    não implementada).'
  title: Self Remember API
  version: "1.0"
paths:
  /areas:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.areaResponse'
            type: array
      summary: Listar Áreas
      tags:
      - areas
    post:
      consumes:
      - application/json
      parameters:
      - description: Nome e cor (opcional) da Área
        in: body
        name: area
        required: true
        schema:
          $ref: '#/definitions/http.createAreaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.areaResponse'
        "400":
          description: Corpo da requisição inválido
        "409":
          description: Já existe uma Área com este nome
      summary: Criar Área
      tags:
      - areas
  /areas/{id}:
    delete:
      parameters:
      - description: ID da Área
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Área não encontrada ou não pertence ao usuário
        "409":
          description: Área ainda tem Compromissos associados
      summary: Remover Área
      tags:
      - areas
    put:
      consumes:
      - application/json
      parameters:
      - description: ID da Área
        in: path
        name: id
        required: true
        type: string
      - description: Novo nome e cor (opcional)
        in: body
        name: area
        required: true
        schema:
          $ref: '#/definitions/http.updateAreaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.areaResponse'
        "400":
          description: Corpo da requisição inválido
        "404":
          description: Área não encontrada ou não pertence ao usuário
        "409":
          description: Já existe uma Área com este nome
      summary: Editar Área
      tags:
      - areas
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica por e-mail e senha e grava os cookies de sessão (access_token
        e refresh_token).
      parameters:
      - description: E-mail e senha
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/http.loginRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Login bem-sucedido; cookies de sessão gravados
        "400":
          description: Corpo da requisição inválido
        "401":
          description: Credenciais inválidas
      summary: Login
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotaciona o refresh token do cookie e grava uma nova sessão. Reusar
        um token já rotacionado revoga todas as sessões ativas do usuário (ADR-0008).
      produces:
      - application/json
      responses:
        "204":
          description: Sessão renovada; novos cookies gravados
        "401":
          description: Refresh token ausente, expirado, revogado ou já reusado
      summary: Refresh
      tags:
      - auth
  /channels:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.channelResponse'
            type: array
      summary: Listar Canais
      tags:
      - channels
    post:
      consumes:
      - application/json
      parameters:
      - description: Tipo (whatsapp|email) e endereço
        in: body
        name: channel
        required: true
        schema:
          $ref: '#/definitions/http.createChannelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.channelResponse'
        "400":
          description: Corpo inválido ou tipo de Canal desconhecido
      summary: Criar Canal
      tags:
      - channels
  /channels/{id}:
    delete:
      parameters:
      - description: ID do Canal
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Canal não encontrado ou não pertence ao usuário
      summary: Remover Canal
      tags:
      - channels
  /channels/{id}/verify/confirm:
    post:
      parameters:
      - description: ID do Canal
        in: path
        name: id
        required: true
        type: string
      - description: Código recebido
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.confirmVerificationRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Corpo inválido
        "404":
          description: Canal não encontrado ou não pertence ao usuário
        "409":
          description: Nenhum código solicitado, código expirado, ou código incorreto
      summary: Confirmar código de verificação do Canal
      tags:
      - channels
  /channels/{id}/verify/request:
    post:
      parameters:
      - description: ID do Canal
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Canal não encontrado ou não pertence ao usuário
        "502":
          description: Falha ao enviar o código pelo próprio Canal
      summary: Solicitar código de verificação do Canal
      tags:
      - channels
  /commitments:
    get:
      parameters:
      - description: Incluir Compromissos arquivados
        in: query
        name: include_archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.commitmentResponse'
            type: array
      summary: Listar Compromissos
      tags:
      - commitments
    post:
      consumes:
      - application/json
      parameters:
      - description: Compromisso a criar
        in: body
        name: commitment
        required: true
        schema:
          $ref: '#/definitions/http.createCommitmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.commitmentResponse'
        "400":
          description: Corpo inválido, Compromisso inválido, ou Área/Etiqueta não
            pertence ao usuário
      summary: Criar Compromisso
      tags:
      - commitments
  /commitments/{id}/archive:
    post:
      parameters:
      - description: ID do Compromisso
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Compromisso não encontrado ou não pertence ao usuário
      summary: Arquivar Compromisso
      tags:
      - commitments
  /dashboard:
    get:
      description: Dias e atrasadas são calculados no fuso de Ajustes. Só Ocorrências
        em aberto de Compromissos não arquivados.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.dashboardResponse'
        "404":
          description: Usuário sem Ajustes gravados (fuso desconhecido)
      summary: 'Painel inicial: atrasadas e agenda dos próximos 7 dias'
      tags:
      - occurrences
  /labels:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.labelResponse'
            type: array
      summary: Listar Etiquetas
      tags:
      - labels
    post:
      consumes:
      - application/json
      parameters:
      - description: Nome da Etiqueta
        in: body
        name: label
        required: true
        schema:
          $ref: '#/definitions/http.createLabelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.labelResponse'
        "400":
          description: Corpo da requisição inválido
        "409":
          description: Já existe uma Etiqueta com este nome
      summary: Criar Etiqueta
      tags:
      - labels
  /occurrences/{id}/complete:
    post:
      parameters:
      - description: ID da Ocorrência
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Ocorrência não encontrada ou não pertence ao usuário
        "409":
          description: Transição inválida a partir do estado atual
      summary: Reconhecer Conclusão
      tags:
      - occurrences
  /occurrences/{id}/dismiss:
    post:
      parameters:
      - description: ID da Ocorrência
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Ocorrência não encontrada ou não pertence ao usuário
        "409":
          description: Transição inválida a partir do estado atual
      summary: Reconhecer Desistência
      tags:
      - occurrences
  /occurrences/{id}/snooze:
    post:
      parameters:
      - description: ID da Ocorrência
        in: path
        name: id
        required: true
        type: string
      - description: Novo vencimento
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.snoozeRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Corpo inválido
        "404":
          description: Ocorrência não encontrada ou não pertence ao usuário
        "409":
          description: Transição inválida, ou novo vencimento não é depois do atual
      summary: Reconhecer Adiamento
      tags:
      - occurrences
  /occurrences/today:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.occurrenceResponse'
            type: array
        "404":
          description: Usuário sem Ajustes gravados (fuso desconhecido) — mesma condição
            de GET /settings
      summary: Ocorrências de hoje
      tags:
      - occurrences
  /settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.settingsResponse'
        "404":
          description: Usuário sem Ajustes gravados
      summary: Ver Ajustes
      tags:
      - settings
    put:
      consumes:
      - application/json
      parameters:
      - description: Fuso IANA, Janela de Silêncio e Preferências padrão
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/http.updateSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.settingsResponse'
        "400":
          description: Corpo inválido, fuso desconhecido, horário malformado, ou Perfil/Política
            inválidos
      summary: Gravar Ajustes
      tags:
      - settings
  /whatsapp-instance/qrcode:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.instanceQRCodeResponse'
        "502":
          description: EvolutionAPI inacessível
      summary: Solicitar QR code de pareamento da instância WhatsApp
      tags:
      - whatsapp-instance
  /whatsapp-instance/status:
    get:
      description: state="not_provisioned" significa que a instância ainda não foi
        criada — normal antes do primeiro pareamento, não é falha.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.instanceStatusResponse'
        "502":
          description: EvolutionAPI inacessível
      summary: Estado da instância WhatsApp
      tags:
      - whatsapp-instance
swagger: "2.0"
