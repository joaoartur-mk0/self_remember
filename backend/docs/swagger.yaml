basePath: /api/v1
definitions:
  http.areaResponse:
    properties:
      color:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  http.createAreaRequest:
    properties:
      color:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  http.createLabelRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  http.labelResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  http.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
info:
  contact: {}
  description: 'API do Self Remember. Local/dev apenas: /swagger não é exposto em
    produção sem Traefik/auth na frente (ARCHITECTURE.md §9, fase de Produção ainda
    não implementada).'
  title: Self Remember API
  version: "1.0"
paths:
  /areas:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.areaResponse'
            type: array
      summary: Listar Áreas
      tags:
      - areas
    post:
      consumes:
      - application/json
      parameters:
      - description: Nome e cor (opcional) da Área
        in: body
        name: area
        required: true
        schema:
          $ref: '#/definitions/http.createAreaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.areaResponse'
        "400":
          description: Corpo da requisição inválido
        "409":
          description: Já existe uma Área com este nome
      summary: Criar Área
      tags:
      - areas
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica por e-mail e senha e grava os cookies de sessão (access_token
        e refresh_token).
      parameters:
      - description: E-mail e senha
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/http.loginRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Login bem-sucedido; cookies de sessão gravados
        "400":
          description: Corpo da requisição inválido
        "401":
          description: Credenciais inválidas
      summary: Login
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotaciona o refresh token do cookie e grava uma nova sessão. Reusar
        um token já rotacionado revoga todas as sessões ativas do usuário (ADR-0008).
      produces:
      - application/json
      responses:
        "204":
          description: Sessão renovada; novos cookies gravados
        "401":
          description: Refresh token ausente, expirado, revogado ou já reusado
      summary: Refresh
      tags:
      - auth
  /labels:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.labelResponse'
            type: array
      summary: Listar Etiquetas
      tags:
      - labels
    post:
      consumes:
      - application/json
      parameters:
      - description: Nome da Etiqueta
        in: body
        name: label
        required: true
        schema:
          $ref: '#/definitions/http.createLabelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.labelResponse'
        "400":
          description: Corpo da requisição inválido
        "409":
          description: Já existe uma Etiqueta com este nome
      summary: Criar Etiqueta
      tags:
      - labels
swagger: "2.0"
