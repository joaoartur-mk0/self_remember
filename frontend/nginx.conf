# SPA + proxy reverso para /api/ — essencial para os cookies
# SameSite=Strict do backend: o browser precisa ver frontend e API na mesma
# origem (ARCHITECTURE.md §7, backend/internal/adapters/http/middleware.go).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
